<!doctype html>
<html lang="en" data-v="__ASSET_V__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operations · FlipFirst</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/static/brand/favicon.svg?v=__ASSET_V__" type="image/svg+xml">
<link rel="stylesheet" href="/static/ff.css?v=__ASSET_V__">
<script>try{var t=localStorage.getItem("ff-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  .ops-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
             padding: var(--s3) var(--s4); background: color-mix(in srgb, var(--surface) 90%, transparent);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .ops-top .brand { --brand-h: 20px; }
  .ops-top__title { font-weight: 650; color: var(--muted); border-left: 1px solid var(--line-strong); padding-left: var(--s3); }
  .ops { max-width: 1240px; margin: 0 auto; padding: var(--s5) var(--s4) var(--s12); }
  .ops-grid { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); margin-top: var(--s4); }
  @media (min-width: 1024px) { .ops-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
                               .ops { padding: var(--s6) var(--s8) var(--s12); } }
  .span-all { grid-column: 1 / -1; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .readiness { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; padding: var(--s4) var(--s5); }
  .readiness__label { font-size: var(--fs-lg); font-weight: 700; }
  .kpi__value.ok { color: var(--profit); } .kpi__value.bad { color: var(--danger); } .kpi__value.warn { color: var(--warn); }
  .src-name { font-weight: 600; }
  .na { color: var(--muted); font-style: italic; }
  @media (min-width: 1100px) { .kpis--8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="ops-top">
  <a class="brand" href="/m" aria-label="FlipFirst app">
    <span class="brand__emblem" aria-hidden="true"></span><span class="brand__word" aria-hidden="true"></span>
  </a>
  <span class="ops-top__title">Operations</span>
  <div class="spacer"></div>
  <div class="seg" role="radiogroup" aria-label="Time window" id="window">
    <button class="seg__btn" type="button" role="radio" data-h="24" aria-checked="true">24h</button>
    <button class="seg__btn" type="button" role="radio" data-h="72" aria-checked="false">3 days</button>
    <button class="seg__btn" type="button" role="radio" data-h="168" aria-checked="false">7 days</button>
  </div>
  <button class="btn btn--icon" type="button" id="refresh" aria-label="Refresh" title="Refresh"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg?v=__ASSET_V__#i-refresh"></use></svg></button>
  <a class="btn" href="/m">Open app</a>
</header>
<main class="ops" id="main" tabindex="-1">
  <div class="kpis kpis--8"><div class="skel" style="height:104px;border-radius:16px"></div><div class="skel" style="height:104px;border-radius:16px"></div><div class="skel" style="height:104px;border-radius:16px"></div><div class="skel" style="height:104px;border-radius:16px"></div></div>
</main>
<script src="/static/ff.js?v=__ASSET_V__"></script>
<script src="/static/ops.js?v=__ASSET_V__"></script>
</body>
</html>

name: ci

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

# Read-only token: CI never needs to write, and fork PRs get no secrets.
permissions:
  contents: read

jobs:
  tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Valuation benchmark (synthetic labeled cases)
        run: python benchmarks/run_benchmark.py

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # one throwaway database per test (tests/conftest.py)
      SNIPER_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Seed throwaway DB and start server
        env: { SNIPER_DB_PATH: /tmp/smoke.db, ALLOW_REGISTRATION: "1" }
        run: |
          python tests/browser/seed_demo.py
          nohup python server.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/health && break; sleep 0.5; done
      - name: Start an invite-only server (seller listings on) on the same DB
        env: { SNIPER_DB_PATH: /tmp/smoke.db, ALLOW_REGISTRATION: "0", SNIPER_SELLER_SUBMISSIONS: "1",
               BILLING_ORIGIN: "http://127.0.0.1:8766", SNIPER_LOG_DIR: /tmp }
        run: |
          nohup gunicorn server:app --workers 2 --bind 127.0.0.1:8766 > /tmp/server-invite.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8766/health && break; sleep 0.5; done
      - name: Mobile UI smoke test
        env:
          BASE: http://127.0.0.1:8765
          SHOTS: /tmp
          PROMOTE_CMD: >-
            SNIPER_DB_PATH=/tmp/smoke.db python -c "import auth;
            auth.set_plan(auth.get_user_by_email('{email}').id, 'starter')"
        run: node tests/browser/smoke_mobile.js
      - name: Critical UI flows (invites, seller wizard, account, ops, layout)
        env:
          BASE: http://127.0.0.1:8766
          SHOTS: /tmp
          INVITE_CMD: SNIPER_DB_PATH=/tmp/smoke.db BILLING_ORIGIN=http://127.0.0.1:8766 python -m invites issue --note ci
          ADMIN_CMD: >-
            SNIPER_DB_PATH=/tmp/smoke.db python -c "import auth;
            auth.set_role(auth.get_user_by_email('{email}').id, 'admin')"
        run: node tests/browser/ui_flows.js
      - name: Server exceptions as annotations
        if: failure()
        run: |
          for f in /tmp/server.log /tmp/server-invite.log; do
            grep -E "^(Traceback|[A-Za-z_.]*(Error|Exception)\b)" "$f" | tail -n 5 | sed "s|^|::error title=$(basename "$f")::|" || true
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            /tmp/m-*.png
            /tmp/flow-*.png

  # The one-container cloud deploy (Dockerfile + deploy/paas/start.sh,
  # used by render.yaml): build the image, boot it against Postgres, and
  # check that migrations, worker, scheduler and web all came up.
  container-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: flipfirst }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flipfirst:ci .
      - name: Image holds no secrets, tests or local databases
        run: |
          docker run --rm --entrypoint sh flipfirst:ci -c \
            'test ! -e .env && test ! -e overrides.json && test ! -d tests && test ! -d .git \
             && ! ls *.db *.sqlite 2>/dev/null && test -f server.py && test -d static && test -d migrations'
      - name: Boot the container
        run: |
          docker run -d --name ff --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/flipfirst \
            -e PORT=10000 -e SNIPER_COMMERCIAL_MODE=1 -e ALLOW_REGISTRATION=1 \
            -e RENDER_EXTERNAL_URL=http://127.0.0.1:10000 flipfirst:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:10000/health && break; sleep 1; done
      - name: Pages, signup and background processes
        run: |
          set -e
          curl -sf -o /dev/null http://127.0.0.1:10000/login
          curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:10000/m
          curl -sf -H 'content-type: application/json' -H 'Origin: http://127.0.0.1:10000' \
            -d '{"email":"ci@example.com","password":"container-pass-1"}' \
            http://127.0.0.1:10000/api/auth/register
          for i in $(seq 1 30); do docker logs ff 2>&1 | grep -q '"event": "started"' && break; sleep 1; done
          docker logs ff 2>&1 | grep -q 'new migration(s) applied'
          docker logs ff 2>&1 | grep -q '"event": "started"'          # scheduler holds the lease
          echo "Pr0per-admin-pass" | docker exec -i ff python -m accounts create-admin owner@example.com
      - name: Stops cleanly
        run: |
          docker stop -t 20 ff
          test "$(docker inspect -f '{{.State.ExitCode}}' ff)" = "0"
      - if: always()
        run: docker logs ff 2>&1 | tail -n 80 || true

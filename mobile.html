<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Sniper</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #14171c; --muted: #646b76; --line: #e3e6eb;
  --accent: #0b6bcb; --good: #127a3a; --warn: #9a6200; --bad: #b42318; --chip: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --card: #181c22; --ink: #e9edf2; --muted: #98a1ad; --line: #2a3039;
          --accent: #5aa7ff; --good: #4cc27a; --warn: #e0a640; --bad: #ff6b5e; --chip: #232932; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--card);
         border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-weight: 700; font-size: 17px; }
.plan { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
nav { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
nav button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap;
             padding: 7px 9px; border-radius: 99px; font: inherit; font-size: 13px; }
nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 12px 16px 80px; max-width: 720px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        margin-bottom: 12px; overflow: hidden; }
.card .img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--chip); display: block; }
.pad { padding: 12px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.title { font-weight: 600; margin: 0 0 2px; }
.muted { color: var(--muted); font-size: 13px; }
.price { font-size: 20px; font-weight: 700; }
.was { color: var(--muted); text-decoration: line-through; font-size: 14px; margin-left: 6px; }
.disc { font-weight: 700; color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.btn { flex: 1; text-align: center; border: 1px solid var(--line); background: var(--card); color: var(--ink);
       padding: 9px 10px; border-radius: 10px; font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; display: none; }
.sheet.open { display: block; }
.sheet header .back { border: 0; background: none; color: var(--accent); font: inherit; font-size: 16px; padding: 0; }
h3 { font-size: 15px; margin: 18px 0 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r { text-align: right; white-space: nowrap; }
ul.reasons { margin: 0; padding-left: 18px; font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
                background: var(--card); color: var(--ink); font: inherit; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.steps { display: flex; gap: 4px; margin-bottom: 12px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps span.on { background: var(--accent); }
.notice { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.err { color: var(--bad); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">🎯 Car Sniper</div>
    <div><span class="plan" id="plan">…</span> <a class="muted" id="console" href="/" hidden>Owner console</a>
      <a class="muted" href="#" id="signout">Sign out</a></div>
  </div>
  <nav id="tabs">
    <button data-feed="mine" class="on">My matches</button>
    <button data-feed="trusted">Trusted deals</button>
    <button data-feed="risk">Risky</button>
    <button data-feed="setup">Setup</button>
  </nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<div class="sheet" id="sheet">
  <header><button class="back" id="sheet-back">‹ Back</button></header>
  <main id="sheet-body"></main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;
const money = n => n == null ? "–" : "$" + Math.round(Number(n)).toLocaleString();
const ago = iso => {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
async function api(url, opts) {
  const r = await fetch(url, Object.assign({credentials: "same-origin",
    headers: {"Content-Type": "application/json"}}, opts || {}));
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.error || ("HTTP " + r.status)), {status: r.status, body});
  return body;
}
const post = (url, body) => api(url, {method: "POST", body: JSON.stringify(body || {})});

const EVIDENCE = {confirmed_sales: "completed sales", asking_comparables: "local asking prices",
                  historical_incomplete: "old/partial sales", model_estimate: "model estimate",
                  insufficient: "not enough data"};
const FLAG = {scam_signals: ["scam signals", "bad"], too_good_to_be_true: ["too good to be true", "bad"],
              branded_title: ["branded title", "bad"], needs_work: ["needs work", "bad"],
              dealer: ["dealer", "warn"], seller_type_unknown: ["seller type unknown", "warn"], mileage_unknown: ["mileage unknown", "warn"],
              relisted: ["relisted", "warn"], low_confidence: ["low confidence", "warn"],
              insufficient_data: ["not enough data", "warn"]};
let ME = null, FEED = "mine";

function card(d) {
  const img = safeUrl(d.image);
  const link = safeUrl(d.url);
  const flags = (d.risk_flags || []).map(f => {
    const [t, c] = FLAG[f] || [f, ""]; return `<span class="chip ${c}">${esc(t)}</span>`; }).join("");
  const conf = d.confidence ? `<span class="chip ${d.confidence === "high" ? "good" :
    d.confidence === "low" ? "warn" : ""}">${esc(d.confidence)} confidence</span>` : "";
  const ev = d.evidence_class ? `<span class="chip">${esc(EVIDENCE[d.evidence_class] || d.evidence_class)}${d.comp_n ? " · n=" + esc(d.comp_n) : ""}</span>` : "";
  const drop = d.previous_price && d.previous_price > d.price
    ? `<span class="was">${money(d.previous_price)}</span>` : "";
  const pr = d.profit ? (d.profit.conservative != null
      ? `${money(d.profit.conservative)} – ${money(d.profit.optimistic)}`
      : money(d.profit.base)) : "–";
  const status = d.user_status ? `<span class="chip">${esc(d.user_status.replace("_", " "))}</span>` : "";
  const event = d.event === "price_drop" ? `<span class="chip good">price drop</span>` : "";
  return `<article class="card" data-cid="${esc(d.composite_id)}">
    ${img ? `<img class="img" loading="lazy" src="${esc(img)}" alt="">` : ""}
    <div class="pad">
      <div class="row"><p class="title">${esc(d.title)}</p></div>
      <div class="muted">${esc(d.source)} · ${d.odometer ? Number(d.odometer).toLocaleString() + " mi" : "mileage unknown"}
        · ${esc(d.location || d.state || "")}${d.distance_mi != null ? " (" + Math.round(d.distance_mi) + " mi away)" : ""}
        · seen ${esc(ago(d.first_seen_at))}</div>
      <div class="row" style="margin-top:6px">
        <div><span class="price">${money(d.price)}</span>${drop}</div>
        <div class="disc">${d.discount_pct != null ? Math.round(d.discount_pct) + "% under" : ""}</div>
      </div>
      <div class="muted">Value ${d.value_low ? money(d.value_low) + " – " + money(d.value_high) : money(d.value_mid)}
        · est. profit ${pr}</div>
      ${d.opportunity && d.opportunity.risk_adjusted_profit != null ? `<div class="muted">Rank: <b>${money(d.opportunity.risk_adjusted_profit)}</b> risk-adjusted (see Details)</div>` : ""}
      <div class="chips">${event}${conf}${ev}${flags}${status}</div>
      <div class="actions">
        <button class="btn primary" data-open>Details</button>
        ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Listing ↗</a>` : ""}
        <button class="btn" data-act="save">Save</button>
        <button class="btn" data-act="dismiss">Dismiss</button>
      </div>
    </div></article>`;
}

async function sourceSummary() {
  try {
    const list = await api("/api/diagnostics");
    const bad = list.filter(s => s.enabled && !["healthy"].includes(s.status));
    const ok = list.filter(s => s.status === "healthy").length;
    if (!bad.length) return `<p class="notice">${ok} source(s) healthy.</p>`;
    return `<p class="notice">${ok} source(s) healthy. Unavailable or unproven: ` +
      bad.map(s => `${esc(s.name)} — ${esc(s.status)}`).join("; ") + `.</p>`;
  } catch (e) { return ""; }
}

async function showFeed(feed) {
  FEED = feed;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.feed === feed));
  const main = $("#main");
  if (feed === "setup") return showSetup();
  main.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const rows = await api("/api/deals?feed=" + feed + "&limit=40");
    if (!rows.length) {
      const msg = {
        mine: "No matches yet. Matches appear when a listing meets one of your saved searches.",
        trusted: "No trusted deals right now. We only list cars with medium+ valuation confidence and no risk flags.",
        risk: "No risk-flagged listings right now."}[feed];
      main.innerHTML = `<div class="empty">${esc(msg)}</div>` + await sourceSummary() +
        (feed === "mine" ? `<button class="btn primary" style="width:100%" onclick="showFeed('setup')">Set up a search</button>` : "");
      return;
    }
    const intro = feed === "risk" ? `<p class="notice">These have risk flags (branded title, needs work, scam signals, low confidence…). Shown for transparency — verify before acting.</p>` : "";
    main.innerHTML = intro + rows.map(card).join("") +
      `<p class="muted" style="text-align:center">Values and profits are estimates, not guarantees.</p>`;
  } catch (e) {
    main.innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
  }
}

async function act(cid, action, btn) {
  try {
    btn && (btn.disabled = true);
    await post("/api/deals/" + encodeURIComponent(cid) + "/action", {action});
    if (action === "dismiss") document.querySelector(`[data-cid="${CSS.escape(cid)}"]`)?.remove();
    else if (btn) btn.textContent = "✓ " + action;
  } catch (e) {
    alert(e.status === 402 ? "Saving deals needs a Lite or Pro plan." : e.message);
    btn && (btn.disabled = false);
  }
}

async function openDeal(cid) {
  const body = $("#sheet-body");
  body.innerHTML = '<div class="empty">Loading…</div>';
  $("#sheet").classList.add("open");
  try {
    const d = await api("/api/deals/" + encodeURIComponent(cid));
    const p = d.profit_detail;
    const comps = ((d.evidence || {}).comps || []).slice(0, 10).map(c => {
      const u = safeUrl(c.url);
      return `<tr><td>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(c.title || c.source)}</a>` : esc(c.title || c.source)}
        <div class="muted">${esc(c.kind)}${c.sale_date ? " · sold " + esc(c.sale_date) : ""}${c.odometer ? " · " + Number(c.odometer).toLocaleString() + " mi" : ""}</div></td>
        <td class="r">${money(c.price)}${c.adjusted_value && c.adjusted_value !== c.price ? `<div class="muted">adj ${money(c.adjusted_value)}</div>` : ""}</td></tr>`;
    }).join("");
    const hist = (d.price_history || []).map(h =>
      `<tr><td>${esc(h.event.replace("_", " "))}<div class="muted">${esc(new Date(h.observed_at).toLocaleString())}</div></td><td class="r">${money(h.price)}</td></tr>`).join("");
    const scen = p ? Object.entries(p.scenarios).map(([k, v]) =>
      `<tr><td>${esc(k)}<div class="muted">resale ${money(v.resale)}</div></td><td class="r"><b>${money(v.profit)}</b><div class="muted">${v.roi_pct != null ? v.roi_pct + "% ROI" : ""}${v.days_to_sell ? " · ~" + esc(v.days_to_sell) + " days" : ""}</div></td></tr>`).join("") : "";
    const link = safeUrl(d.url);
    body.innerHTML = `
      ${card(d)}
      <h3>Market value</h3>
      <p>${d.value_mid ? `${money(d.value_low)} – ${money(d.value_high)} (mid ${money(d.value_mid)})` : "Not enough data to value this car."}
        <br><span class="muted">Based on ${esc(EVIDENCE[d.evidence_class] || "—")}, ${esc(d.comp_n || 0)} comparables, ${esc(d.confidence || "—")} confidence.</span></p>
      <ul class="reasons">${(d.confidence_reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      ${comps ? `<h3>Comparables used</h3><table>${comps}</table>` : ""}
      ${d.opportunity && d.opportunity.factors ? `<h3>Why it ranks here</h3>
        <p class="muted">Conservative profit ${money(d.opportunity.conservative_profit)} × ${esc(d.opportunity.multiplier)} = <b>${money(d.opportunity.risk_adjusted_profit)}</b> risk-adjusted</p>
        <table>${d.opportunity.factors.map(f => `<tr><td>${esc(f.name)}<div class="muted">${esc(f.why)}</div></td><td class="r">×${esc(f.value)}</td></tr>`).join("")}</table>` : ""}
      <h3>Profit estimate</h3>
      ${p ? `<table>${scen}</table>
        <ul class="reasons">${p.explanation.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        ${p.not_included.length ? `<p class="notice">Not included: ${p.not_included.map(esc).join("; ")}.</p>` : ""}
        <details><summary class="muted">Edit my assumptions</summary><div id="assume"></div></details>`
        : `<p class="muted">No valuation, so no profit estimate.</p>`}
      ${hist ? `<h3>Price history</h3><table>${hist}</table>` : ""}
      <h3>Seller's description</h3><p class="muted">${esc(d.description || "—")}</p>
      <div class="actions"><button class="btn" data-act="contacted">Mark contacted</button>
        ${link ? `<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open listing ↗</a>` : ""}</div>`;
    body.querySelector("article").dataset.cid = d.composite_id;
    if (p) renderAssumptions(p, cid);
  } catch (e) { body.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function renderAssumptions(p, cid) {
  const box = $("#assume");
  const s = await api("/api/me/profit_settings").catch(() => null);
  if (!s) return;
  const keys = ["negotiation_pct", "mechanical", "recon", "transport", "selling_fees",
                "holding_per_day", "days_to_sell", "misc", "sales_tax_pct",
                "title_registration", "asking_to_sale_pct"];
  box.innerHTML = `<div class="grid2">` + keys.map(k => `<div><label>${esc(s.labels[k])}${k.endsWith("_pct") ? " (%)" : k === "days_to_sell" ? "" : " ($)"}</label>
     <input data-k="${k}" type="number" step="any" value="${s.effective[k] == null ? "" : esc(s.effective[k])}" placeholder="not set"></div>`).join("") +
    `</div><button class="btn primary" style="width:100%;margin-top:10px" id="assume-save">Save assumptions</button><div class="err" id="assume-err"></div>`;
  $("#assume-save").onclick = async () => {
    const body = {};
    box.querySelectorAll("input").forEach(i => body[i.dataset.k] = i.value === "" ? null : Number(i.value));
    try { await post("/api/me/profit_settings", body); openDeal(cid); }
    catch (e) { $("#assume-err").textContent = e.status === 402 ? "Custom assumptions need a paid plan." : e.message; }
  };
}

// ---------- onboarding / setup ----------
let STEP = 0;
const DRAFT = {};
function stepper(n) { return `<div class="steps">${[0,1,2,3].map(i => `<span class="${i <= n ? "on" : ""}"></span>`).join("")}</div>`; }

async function showSetup() {
  const main = $("#main");
  let searches = [];
  try { searches = await api("/api/saved_searches"); } catch (e) {}
  const list = searches.length ? `<h3>Your searches</h3>` + searches.map(s =>
    `<div class="card pad row"><div><b>${esc(s.name)}</b><div class="muted">${esc(Object.entries(s.filter || {}).map(([k, v]) => k + ": " + v).join(" · "))}</div></div>
     <button class="btn" style="flex:0 0 auto" data-show="${Number(s.id)}">Matches</button></div>`).join("") : "";
  main.innerHTML = `<div id="plan-card"></div>` + list +
    `<h3>${searches.length ? "Add a search" : "Let's find your first deal"}</h3><div id="wizard" class="card pad"></div>`;
  STEP = 0; renderStep();
  renderPlan();
}

async function renderPlan() {
  const box = $("#plan-card");
  let b;
  try { b = await api("/api/billing/me"); } catch (e) { return; }
  const plan = ((b.user || {}).plan) || "free";
  const name = {free: "Free", starter: "Lite", pro: "Pro"}[plan] || plan;
  let actions = "";
  if (b.subscription) {
    actions = `<button class="btn" id="bill-manage">Manage subscription</button>`;
  } else if (b.billing_available) {
    actions = (plan === "free" ? `<button class="btn primary" data-up="starter">Upgrade to Lite</button>` : "") +
      (plan !== "pro" ? `<button class="btn primary" data-up="pro">Upgrade to Pro</button>` : "");
  } else if (plan === "free") {
    actions = `<p class="muted">Paid plans aren't open yet.</p>`;
  }
  box.innerHTML = `<h3>Your plan</h3><div class="card pad"><b>${esc(name)}</b>
    <div class="muted">Free browses deals; Lite adds saved-search alerts; Pro adds profit scenarios, price-drop alerts and SMS.</div>
    <div class="actions">${actions}</div><div class="err" id="bill-err"></div></div>`;
  box.querySelectorAll("[data-up]").forEach(btn => btn.onclick = async () => {
    box.querySelectorAll("button").forEach(x => x.disabled = true);
    try { const r = await post("/api/billing/checkout", {plan: btn.dataset.up}); if (r.url) location.assign(r.url); }
    catch (e) { $("#bill-err").textContent = "Couldn't start checkout — try again."; box.querySelectorAll("button").forEach(x => x.disabled = false); }
  });
  const m = $("#bill-manage");
  if (m) m.onclick = async () => {
    m.disabled = true;
    try { const r = await post("/api/billing/portal", {}); if (r.url) location.assign(r.url); }
    catch (e) { $("#bill-err").textContent = "Billing portal unavailable — try again later."; m.disabled = false; }
  };
}

function renderStep() {
  const w = $("#wizard");
  const v = k => esc(DRAFT[k] ?? "");
  const steps = [
    () => `${stepper(0)}<b>1. What are you hunting?</b>
      <div class="grid2"><div><label>Make</label><input id="f-make" placeholder="Toyota" value="${v("make")}"></div>
      <div><label>Model</label><input id="f-model" placeholder="Tacoma" value="${v("model")}"></div></div>
      <div class="grid2"><div><label>Max price ($)</label><input id="f-max_price" type="number" value="${v("max_price")}"></div>
      <div><label>Max miles</label><input id="f-max_miles" type="number" value="${v("max_miles")}"></div></div>
      <label>Oldest model year</label><input id="f-min_year" type="number" placeholder="2008" value="${v("min_year")}">`,
    () => `${stepper(1)}<b>2. Your buying territory</b>
      <div class="grid2"><div><label>Home ZIP</label><input id="f-zip" inputmode="numeric" maxlength="5" placeholder="35401" value="${v("zip")}"></div>
      <div><label>Max distance (miles)</label><input id="f-radius_mi" type="number" min="10" max="500" value="${v("radius_mi") || 75}"></div></div>
      <p class="notice">Only cars within this distance alert you. Listings with no reliable location are skipped. Coverage depends on which sources are healthy.</p>`,
    () => `${stepper(2)}<b>3. What's a deal to you?</b>
      <div class="grid2"><div><label>Min % under market</label><input id="f-min_discount_pct" type="number" value="${v("min_discount_pct") || 15}"></div>
      <div><label>Min est. profit ($)</label><input id="f-min_profit" type="number" placeholder="optional" value="${v("min_profit")}"></div></div>
      <label>Risk</label><select id="f-risk_mode"><option value="conservative">Conservative — trusted, medium+ confidence only</option>
      <option value="aggressive"${DRAFT.risk_mode === "aggressive" ? " selected" : ""}>Aggressive — include risk-labeled (Pro)</option></select>`,
    () => `${stepper(3)}<b>4. Where should alerts go?</b>
      <p class="notice">Free instant push: install the <b>ntfy</b> app, then tap below and subscribe to the topic it shows.</p>
      <button class="btn" id="gen-topic" style="width:100%">Create my push topic</button>
      <div class="muted" id="topic-out" style="margin-top:6px"></div>
      <label>Or a Discord/Slack webhook (https)</label><input id="f-webhook" placeholder="https://discord.com/api/webhooks/…">
      <label>Search name</label><input id="f-name" placeholder="Cheap Tacomas" value="${v("name")}">`,
  ];
  w.innerHTML = steps[STEP]() + `<div class="actions">
      ${STEP ? '<button class="btn" id="prev">Back</button>' : ""}
      <button class="btn primary" id="next">${STEP === 3 ? "Save search" : "Next"}</button></div><div class="err" id="werr"></div>`;
  if (STEP === 3) {
    $("#gen-topic").onclick = async () => {
      try { const c = await post("/api/me/alert_channels", {ntfy_topic: "generate"});
        $("#topic-out").textContent = "Subscribe in ntfy to: " + c.ntfy_server + "/" + c.ntfy_topic; }
      catch (e) { $("#topic-out").textContent = e.status === 402 ? "Alerts need a Lite or Pro plan." : e.message; }
    };
  }
  $("#prev") && ($("#prev").onclick = () => { collect(); STEP--; renderStep(); });
  $("#next").onclick = async () => {
    collect();
    if (STEP < 3) { STEP++; return renderStep(); }
    const f = {};
    ["make", "model", "max_price", "max_miles", "min_year", "min_discount_pct",
     "min_profit", "risk_mode"].forEach(k => { if (DRAFT[k] !== undefined && DRAFT[k] !== "") f[k] = DRAFT[k]; });
    try {
      if (DRAFT.zip) await post("/api/me/territory", {home_zip: DRAFT.zip, radius_mi: Number(DRAFT.radius_mi || 75)});
      const hook = ($("#f-webhook").value || "").trim();
      if (hook) await post("/api/me/alert_channels", {alert_webhook: hook});
      const r = await post("/api/saved_searches", {name: DRAFT.name || "My search", notify_enabled: true, filter: f});
      showSearchMatches(r.id, true);
    } catch (e) {
      $("#werr").textContent = e.status === 402 ? (e.body.error || "This needs a paid plan.") : e.message;
    }
  };
}
function collect() {
  document.querySelectorAll("#wizard [id^=f-]").forEach(i => DRAFT[i.id.slice(2)] = i.value.trim());
}

async function showSearchMatches(id, fresh) {
  const main = $("#main");
  main.innerHTML = '<div class="empty">Checking current listings…</div>';
  try {
    const rows = await api("/api/deals?feed=search&search_id=" + id + "&limit=20");
    main.innerHTML = (fresh ? `<p class="notice">Saved. New matches will be pushed to you as they're found.</p>` : "") +
      (rows.length ? `<h3>Current listings that match</h3>` + rows.map(card).join("")
                   : `<div class="empty">Nothing matches right now — that's normal. You'll get an alert when something does.</div>` + await sourceSummary());
  } catch (e) { main.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

// ---------- wiring ----------
document.addEventListener("click", e => {
  const art = e.target.closest("article[data-cid]");
  const show = e.target.closest("[data-show]");
  if (show) return showSearchMatches(show.dataset.show, false);
  if (!art) return;
  const cid = art.dataset.cid;
  const a = e.target.closest("[data-act]");
  if (a) { e.preventDefault(); return act(cid, a.dataset.act, a); }
  if (e.target.closest("[data-open]") || (e.target.closest(".img"))) openDeal(cid);
});
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showFeed(b.dataset.feed); });
$("#sheet-back").onclick = () => { $("#sheet").classList.remove("open"); if (FEED !== "setup") showFeed(FEED); };

(async () => {
  try {
    ME = await api("/api/me");
    const plan = (ME.user || {}).plan || "free";
    $("#plan").textContent = {free: "Free", starter: "Lite", pro: "Pro"}[plan] || plan;
    if ((ME.user || {}).role === "admin") $("#console").hidden = false;
    $("#signout").onclick = async e => { e.preventDefault(); try { await post("/api/auth/logout", {}); } catch (x) {} location.replace("/login"); };
    const ret = new URLSearchParams(location.search).get("billing_return");
    if (ret === "success") {
      $("#main").insertAdjacentHTML("beforebegin", `<p class="notice" id="bill-note" style="margin:10px 12px">Payment received — your plan updates as soon as Stripe confirms it (usually a few seconds).</p>`);
      history.replaceState(null, "", "/m");
      for (const wait of [3000, 8000]) setTimeout(async () => {
        try { const me = await api("/api/me"); const p = (me.user || {}).plan || "free";
              $("#plan").textContent = {free: "Free", starter: "Lite", pro: "Pro"}[p] || p; } catch (x) {}
      }, wait);
    }
    let n = 0;
    try { n = (await api("/api/saved_searches")).length; } catch (e) {}
    showFeed(n ? "mine" : "setup");
  } catch (e) { $("#main").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>

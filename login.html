<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sniper — sign in</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#13171c; --line:#222a33; --text:#e7ecf2;
    --muted:#8b97a4; --accent:#27e1a4; --danger:#ff6e6e; --magenta:#ff4eb8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:28px; width:100%; max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.2px; }
  .sub { margin:0 0 22px; color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { flex:1; background:transparent; color:var(--muted);
                 border:1px solid var(--line); padding:8px 0; border-radius:8px;
                 cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--line); color:var(--text); }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--muted); }
  input { width:100%; padding:10px 12px; background:#0e1115; color:var(--text);
          border:1px solid var(--line); border-radius:8px; font-size:14px;
          font-family:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button.primary { width:100%; margin-top:16px; padding:11px 16px;
                   background:var(--accent); color:#0a1714; border:0;
                   border-radius:8px; font-size:14px; font-weight:600;
                   cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  .hint { color:var(--muted); font-size:11px; margin-top:14px; text-align:center; }
  .brand { color:var(--magenta); font-weight:700; letter-spacing:.4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>SNIPER <span class="brand">⟁</span></h1>
    <p class="sub">Sign in to your car-flipper dashboard.</p>
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Sign in</button>
      <button id="tab-register" type="button">Create account</button>
    </div>
    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required
             minlength="8" autocomplete="current-password">
      <button class="primary" id="submit" type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
    <p class="hint">By signing in you agree to the source-of-data terms of each
       marketplace we aggregate.</p>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let mode = "login"; // "login" | "register"

  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("active", m === "login");
    $("tab-register").classList.toggle("active", m === "register");
    $("submit").textContent = (m === "login") ? "Sign in" : "Create account";
    $("password").setAttribute("autocomplete",
      m === "login" ? "current-password" : "new-password");
    $("err").textContent = "";
  }

  $("tab-login").addEventListener("click", () => setMode("login"));
  $("tab-register").addEventListener("click", () => setMode("register"));

  // If we're already signed in, jump straight to the dashboard.
  fetch("/api/me", {credentials: "same-origin"})
    .then(r => r.ok ? location.replace("/") : null)
    .catch(() => {});

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return;
    $("submit").disabled = true;
    $("err").textContent = "";
    const url = (mode === "login")
      ? "/api/auth/login" : "/api/auth/register";
    try {
      const r = await fetch(url, {
        method: "POST",
        credentials: "same-origin",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, password}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        $("err").textContent = data.error || ("HTTP " + r.status);
        $("submit").disabled = false;
        return;
      }
      // Cookie is set; go to the dashboard.
      location.replace("/");
    } catch (err) {
      $("err").textContent = "Network error: " + err.message;
      $("submit").disabled = false;
    }
  });
})();
</script>
</body>
</html>

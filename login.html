<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sniper — sign in</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#13171c; --line:#222a33; --text:#e7ecf2;
    --muted:#8b97a4; --accent:#27e1a4; --danger:#ff6e6e; --magenta:#ff4eb8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:28px; width:100%; max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.2px; }
  .sub { margin:0 0 22px; color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { flex:1; background:transparent; color:var(--muted);
                 border:1px solid var(--line); padding:8px 0; border-radius:8px;
                 cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--line); color:var(--text); }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--muted); }
  input { width:100%; padding:10px 12px; background:#0e1115; color:var(--text);
          border:1px solid var(--line); border-radius:8px; font-size:14px;
          font-family:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button.primary { width:100%; margin-top:16px; padding:11px 16px;
                   background:var(--accent); color:#0a1714; border:0;
                   border-radius:8px; font-size:14px; font-weight:600;
                   cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  .hint { color:var(--muted); font-size:11px; margin-top:14px; text-align:center; }
  .brand { color:var(--magenta); font-weight:700; letter-spacing:.4px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style id="ui-demo-polish">
/* Additive polish layer — reversible by deleting this block. */
:root {
  --bg:#05070d; --panel:rgba(16,21,33,.72); --line:rgba(148,163,184,.12);
  --text:#e6edf6; --muted:#7c8ca6; --accent:#34e8a4;
}
html, body {
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 480px at 75% -10%, rgba(56,207,255,.10), transparent 60%),
    radial-gradient(700px 420px at 15% 10%, rgba(52,232,164,.09), transparent 55%),
    #05070d;
}
.wrap { position:relative; }
.wrap::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(rgba(94,234,212,.045) 1px, transparent 1px) 0 0/56px 56px,
    linear-gradient(90deg, rgba(94,234,212,.045) 1px, transparent 1px) 0 0/56px 56px;
  mask: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 70%);
  -webkit-mask: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 70%);
}
.card {
  border-radius:18px; border:1px solid var(--line);
  background:linear-gradient(165deg, rgba(23,30,47,.82), rgba(12,16,27,.82));
  backdrop-filter:blur(16px) saturate(1.15); -webkit-backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 70px rgba(2,6,16,.7), 0 0 60px rgba(52,232,164,.06);
  padding:32px;
}
h1 {
  font-family:"Space Grotesk",Inter,sans-serif; font-weight:900; font-size:26px;
  letter-spacing:.05em;
  background:linear-gradient(92deg,#eafff6 0%,#7df7cd 55%,#38cfff 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
h1 .brand { -webkit-text-fill-color:#ff4eb8; }
.sub { font-size:13px; }
.tabs button {
  border-radius:10px; font-weight:600; transition:all .15s ease; padding:9px 0;
}
.tabs button:hover { color:var(--text); border-color:rgba(52,232,164,.35); }
.tabs button.active {
  background:rgba(52,232,164,.10); color:var(--accent);
  border-color:rgba(52,232,164,.45); box-shadow:0 0 14px rgba(52,232,164,.12);
}
input {
  border-radius:10px; background:rgba(9,13,22,.75);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus { border-color:rgba(52,232,164,.55); box-shadow:0 0 0 3px rgba(52,232,164,.14); }
button.primary {
  border-radius:11px; font-weight:800; letter-spacing:.02em;
  background:linear-gradient(135deg,#2fe39d 0%,#19b5d0 100%); color:#04120c;
  box-shadow:0 8px 26px rgba(47,227,157,.28), 0 1px 0 rgba(255,255,255,.25) inset;
  transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
button.primary:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.06); }
.hint { line-height:1.6; }
::selection { background:rgba(52,232,164,.25); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>SNIPER <span class="brand">⟁</span></h1>
    <p class="sub">Sign in to your car-flipper dashboard.</p>
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Sign in</button>
      <button id="tab-register" type="button">Create account</button>
    </div>
    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required
             minlength="8" autocomplete="current-password">
      <button class="primary" id="submit" type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
    <p class="hint">By signing in you agree to the source-of-data terms of each
       marketplace we aggregate.</p>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let mode = "login"; // "login" | "register"

  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("active", m === "login");
    $("tab-register").classList.toggle("active", m === "register");
    $("submit").textContent = (m === "login") ? "Sign in" : "Create account";
    $("password").setAttribute("autocomplete",
      m === "login" ? "current-password" : "new-password");
    $("err").textContent = "";
  }

  $("tab-login").addEventListener("click", () => setMode("login"));
  $("tab-register").addEventListener("click", () => setMode("register"));

  // If we're already signed in, jump straight to the dashboard.
  fetch("/api/me", {credentials: "same-origin"})
    .then(r => r.ok ? location.replace("/") : null)
    .catch(() => {});

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return;
    $("submit").disabled = true;
    $("err").textContent = "";
    const url = (mode === "login")
      ? "/api/auth/login" : "/api/auth/register";
    try {
      const r = await fetch(url, {
        method: "POST",
        credentials: "same-origin",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, password}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        $("err").textContent = data.error || ("HTTP " + r.status);
        $("submit").disabled = false;
        return;
      }
      // Cookie is set; go to the dashboard.
      location.replace("/");
    } catch (err) {
      $("err").textContent = "Network error: " + err.message;
      $("submit").disabled = false;
    }
  });
})();
</script>
</body>
</html>
